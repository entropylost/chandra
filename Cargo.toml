[package]
name = "chandra"
version = "0.1.0"
edition = "2024"
default-run = "chandra"

[features]
default = []
# set
# $env.OIDN_DIR = "/home/keter/Documents/oidn-2.3.3.x86_64.linux/"
# $env.LD_LIBRARY_PATH = "/home/keter/Documents/oidn-2.3.3.x86_64.linux/lib/"
denoise = ["dep:oidn"]
voxel = []
trace = ["keter/trace"]

[dependencies]
dot_vox = "5.1.1"
glam = { version = "0.30.0", features = ["serde"] }
keter = { path = "../sefirot/keter", features = ["glam"] }
keter_testbed = { path = "../sefirot/testbed" }
yesod = { path = "../sefirot/yesod", features = ["global-print"] }
palette = "0.7.6"
static_assertions = "1.1.0"
tobj = "4.0.3"
bytemuck = "1.23.2"
itertools = "0.14.0"
image = "0.25.8"
rand = "0.9.2"
histo = "1.0.0"
parking_lot = "0.12.5"
oidn = { version = "2.3.3", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev.package."*"]
opt-level = 3
